; Models served by llama-server in ROUTER mode (LaunchAgent com.llamacpp.vulkan), 127.0.0.1:8080.
; One model on the GPU at a time (--models-max 1); requests are routed by their "model" field and the
; router swaps models automatically (5-12 s on the first message after a switch).
; scripts/install-services.sh replaces __HOME__ and drops every section whose model file is missing.
; All 4-bit: Q6_K / Q8_0 measured ~20 % slower for no noticeable gain; Gemma uses Google's QAT builds.
version = 1

[*]
; Everything on the GPU, 2 CPU threads (no busy-wait), 32k context, one request at a time.
ngl = 99
t = 2
tb = 2
poll = 0
c = 32768
parallel = 1
; fa = auto, NOT "on": Vulkan flash attention isn't available on this GPU, and "on" forces the
; attention onto the CPU (measured: 25.6 -> 32.7 tok/s generation, 170 -> 248 tok/s prompt with "auto").
fa = auto
jinja = true
; Small GPU batches: the Radeon is busy in ~0.6 s chunks instead of ~2 s (ub 512), so the macOS
; display stays responsive while a long prompt is processed. Cost: ~-10 % prompt speed, 0 on generation.
ub = 128

; Qwen 3.5 9B, Q4_K_M + VISION — general use and image/document reading (most reliable on figures).
[qwen3.5-9b-gpu]
model = __HOME__/models/Qwen3.5-9B-Q4_K_M.gguf
mmproj = __HOME__/models/mmproj-Qwen3.5-9B-F16.gguf
; 1024 tokens per image: above that the vision encoder's softmax falls back to the CPU (slow);
; at 768 digits start being misread. Works with ub = 128.
image-max-tokens = 1024
chat-template-kwargs = {"enable_thinking":false}
; vendor-recommended sampling, non-thinking mode
temp = 0.7
top-p = 0.8
top-k = 20
presence-penalty = 1.5
load-on-startup = true

; Gemma 4 E4B, Google QAT Q4_0 — fastest (~44 tok/s): summaries, rewording, everyday questions. TEXT ONLY.
; Vision is possible (add its mmproj + image-max-tokens = 1120 + ub = 1152) but big batches block the GPU
; for ~2 s and freeze the display; with ub = 512 the image is capped and reading fails.
[gemma-4-e4b]
model = __HOME__/models/gemma-4-e4b-it-qat-q4_0.gguf
; Gemma 4 thinks by default (600-750 chars before answering): off, can be re-enabled per request
chat-template-kwargs = {"enable_thinking":false}
temp = 1.0
top-p = 0.95
top-k = 64

; Gemma 4 12B, Google QAT Q4_0 — most capable (~24 tok/s): careful writing, reasoning. TEXT ONLY.
; Vision is possible (mmproj + image-max-tokens = 512 + ub = 512). Never ub > 512 for this model:
; its image encoder then returns wrong values on Vulkan (read 74.34 instead of 97.34).
[gemma-4-12b]
model = __HOME__/models/gemma-4-12b-it-qat-q4_0.gguf
chat-template-kwargs = {"enable_thinking":false}
temp = 1.0
top-p = 0.95
top-k = 64

; Qwen3-Coder 30B-A3B, Q4_K_M (unsloth) — CODE and tool calling. Mixture of experts: 30B parameters in
; total, ~3B active per token. TEXT ONLY. 18.6 GB does not fit in 16 GB of VRAM, so ALL expert weights
; stay in system RAM and run on the CPU (n-cpu-moe = 48 of 48 layers); attention + 32k KV cache on the GPU.
; Measured on a 2,400-token prompt (Radeon Pro 5700 XT 16 GB, i7-10700K):
;   n-cpu-moe 30 / ub 128  : 19.5 tok/s generation, but only 0.3 GB of VRAM left -> display starved
;   n-cpu-moe 40 / ub 128  : prompt  40 tok/s, generation 15   ; 3.2 GB VRAM free
;   n-cpu-moe 40 / ub 1024 : prompt 119 tok/s, generation 13.6 ; 2.0 GB free
;   n-cpu-moe 48 / ub 512  : prompt  84 tok/s, generation 12   ; 5.0 GB free (Qwen 3.5 9B leaves 4)  <- kept
; ub = 512 here (not 128): with experts in RAM every batch copies their weights to the GPU, so tiny
; batches halve prompt speed — which matters for coding agents and their long prompts.
[qwen3-coder-30b]
model = __HOME__/models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
n-cpu-moe = 48
t = 6
tb = 6
ub = 512
; vendor-recommended sampling (Qwen3-Coder has no thinking mode)
temp = 0.7
top-p = 0.8
top-k = 20
repeat-penalty = 1.05
